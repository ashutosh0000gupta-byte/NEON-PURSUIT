<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 512" width="1024" height="512">
  <defs>
    <linearGradient id="qbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020b14"/>
      <stop offset="60%" stop-color="#071927"/>
      <stop offset="100%" stop-color="#023b46"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f7ff"/>
      <stop offset="50%" stop-color="#00b4d8"/>
      <stop offset="100%" stop-color="#90e0ef"/>
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="512" fill="url(#qbg)"/>

  <!-- Energy Wave Lines -->
  <path d="M 0 320 Q 250 200, 500 350 T 1024 220" fill="none" stroke="#00f7ff" stroke-width="4" opacity="0.3"/>
  <path d="M 0 340 Q 300 240, 600 390 T 1024 260" fill="none" stroke="#00b4d8" stroke-width="2" opacity="0.4"/>
  <path d="M 0 360 Q 200 450, 500 300 T 1024 380" fill="none" stroke="#90e0ef" stroke-width="1.5" opacity="0.25"/>

  <!-- Frame & Cyber Grid -->
  <rect x="20" y="20" width="984" height="472" fill="none" stroke="#0e3d54" stroke-width="3"/>
  <rect x="16" y="16" width="992" height="480" fill="none" stroke="#00f7ff" stroke-width="1.5" opacity="0.8"/>
  <circle cx="20" cy="20" r="10" fill="#00f7ff"/>
  <circle cx="1004" cy="20" r="10" fill="#00f7ff"/>
  <circle cx="20" cy="492" r="10" fill="#00f7ff"/>
  <circle cx="1004" cy="492" r="10" fill="#00f7ff"/>

  <!-- Brand Eyebrow -->
  <text x="70" y="82" font-family="'Impact', 'Arial Black', sans-serif" font-size="20" font-weight="900" fill="#00f7ff" letter-spacing="6">
    // NEXT-GEN SYNTHETIC NITRO COMBINATOR
  </text>

  <!-- Main Headline -->
  <g filter="url(#cyanGlow)">
    <text x="65" y="195" font-family="'Impact', 'Arial Black', sans-serif" font-size="105" font-weight="900" font-style="italic" fill="url(#cyanGrad)" letter-spacing="3">
      QUANTUM NITRO
    </text>
  </g>
  <text x="68" y="270" font-family="'Impact', 'Arial Black', sans-serif" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="3">
    105-OCTANE IGNITION BOOST
  </text>

  <!-- Tagline -->
  <text x="70" y="340" font-family="'Segoe UI', 'Arial', sans-serif" font-size="28" font-weight="700" fill="#d0f4de" letter-spacing="2">
    INSTANT TORQUE MULTIPLIER. OUTRUN THE PURSUIT.
  </text>
  <text x="70" y="380" font-family="'Segoe UI', 'Arial', sans-serif" font-size="20" fill="#72efdd">
    High-Pressure Molecular Fuel Injection • Instant Throttle Response
  </text>

  <!-- Nitro Gauge graphic on right -->
  <circle cx="830" cy="256" r="150" fill="#071b29" stroke="#00f7ff" stroke-width="8"/>
  <path d="M 720 256 A 110 110 0 1 1 940 256" fill="none" stroke="#00f7ff" stroke-width="16" stroke-linecap="round"/>
  <line x1="830" y1="256" x2="905" y2="190" stroke="#ff3366" stroke-width="8" stroke-linecap="round"/>
  <circle cx="830" cy="256" r="24" fill="#00f7ff"/>
  <text x="830" y="325" font-family="'Impact', sans-serif" font-size="34" fill="#ffffff" text-anchor="middle">+450 HP</text>
  <text x="830" y="360" font-family="'Arial', sans-serif" font-size="16" font-weight="bold" fill="#00f7ff" text-anchor="middle">PEAK BOOST</text>

  <!-- Refuel CTA -->
  <rect x="70" y="415" width="340" height="55" rx="6" fill="#00b4d8"/>
  <text x="95" y="452" font-family="'Impact', 'Arial Black', sans-serif" font-size="24" fill="#020b14" letter-spacing="2">
    AVAILABLE AT ALL GAS STATIONS ⚡
  </text>

  <text x="980" y="490" font-family="monospace" font-size="12" fill="#588157" text-anchor="end">
    NEON PURSUIT AD-NETWORK // CAMPAIGN ID: QNT-105
  </text>
</svg>

