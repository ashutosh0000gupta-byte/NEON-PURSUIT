<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 512" width="1024" height="512">
  <defs>
    <linearGradient id="hbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0514"/>
      <stop offset="50%" stop-color="#160824"/>
      <stop offset="100%" stop-color="#2d0a4e"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b5179e"/>
      <stop offset="50%" stop-color="#7209b7"/>
      <stop offset="100%" stop-color="#4cc9f0"/>
    </linearGradient>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#39ff14"/>
      <stop offset="100%" stop-color="#00f5d4"/>
    </linearGradient>
    <filter id="purpleGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1024" height="512" fill="url(#hbg)"/>

  <!-- Lightning bolts background -->
  <polygon points="400,0 350,220 460,220 380,512 550,260 440,260 520,0" fill="#39ff14" opacity="0.12"/>
  <polygon points="650,0 600,200 700,200 620,512 780,240 680,240 760,0" fill="#b5179e" opacity="0.1"/>

  <!-- Border -->
  <rect x="20" y="20" width="984" height="472" fill="none" stroke="#4a154b" stroke-width="3"/>
  <rect x="16" y="16" width="992" height="480" fill="none" stroke="#39ff14" stroke-width="1.5" opacity="0.7"/>

  <!-- Header -->
  <text x="70" y="80" font-family="'Impact', 'Arial Black', sans-serif" font-size="22" font-weight="900" fill="#39ff14" letter-spacing="6">
    // ZERO SUGAR • 300MG TAURINE ELECTROLYTES
  </text>

  <!-- Title -->
  <g filter="url(#purpleGlow)">
    <text x="65" y="195" font-family="'Impact', 'Arial Black', sans-serif" font-size="110" font-weight="900" font-style="italic" fill="url(#limeGrad)" letter-spacing="2">
      HYPER CHARGE
    </text>
  </g>
  <text x="68" y="270" font-family="'Impact', 'Arial Black', sans-serif" font-size="62" font-weight="900" fill="#ffffff" letter-spacing="3">
    NEO-ELECTRO STIMULANT
  </text>

  <!-- Description -->
  <text x="70" y="340" font-family="'Segoe UI', 'Arial', sans-serif" font-size="26" font-weight="700" fill="#e0aaff" letter-spacing="2">
    SUB-SECOND REFLEXES. CRUSH THE MIDNIGHT CIRCUITS.
  </text>
  <text x="70" y="380" font-family="'Segoe UI', 'Arial', sans-serif" font-size="20" fill="#c77dff">
    Formulated for Street Racers • Zero Crash Guarantee
  </text>

  <!-- Button -->
  <rect x="70" y="415" width="280" height="55" rx="6" fill="#39ff14"/>
  <text x="95" y="452" font-family="'Impact', 'Arial Black', sans-serif" font-size="24" fill="#050510" letter-spacing="2">
    UNLEASH ENERGY ⚡
  </text>

  <!-- Can Icon Graphic on Right -->
  <g transform="translate(800, 140)">
    <rect x="0" y="40" width="100" height="180" rx="15" fill="#1b0a2a" stroke="#39ff14" stroke-width="6"/>
    <ellipse cx="50" cy="40" rx="50" ry="16" fill="#2d0a4e" stroke="#39ff14" stroke-width="4"/>
    <ellipse cx="50" cy="220" rx="50" ry="16" fill="#0d0417" stroke="#39ff14" stroke-width="4"/>
    <path d="M 50 60 L 30 130 L 60 130 L 40 200 L 75 120 L 52 120 Z" fill="#39ff14"/>
    <text x="50" y="280" font-family="'Impact', sans-serif" font-size="26" fill="#ffffff" text-anchor="middle">ZERO SUGAR</text>
  </g>

  <text x="980" y="490" font-family="monospace" font-size="12" fill="#7b2cbf" text-anchor="end">
    NEON PURSUIT AD-NETWORK // CAMPAIGN ID: HYP-009
  </text>
</svg>

