<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 512" width="1024" height="512">
  <defs>
    <linearGradient id="cbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="50%" stop-color="#091428"/>
      <stop offset="100%" stop-color="#0a2a4a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffb703"/>
      <stop offset="100%" stop-color="#fb8500"/>
    </linearGradient>
    <filter id="goldGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1024" height="512" fill="url(#cbg)"/>

  <!-- Network grid lines -->
  <line x1="0" y1="128" x2="1024" y2="128" stroke="#1d3557" stroke-width="1.5"/>
  <line x1="0" y1="256" x2="1024" y2="256" stroke="#1d3557" stroke-width="1.5"/>
  <line x1="0" y1="384" x2="1024" y2="384" stroke="#1d3557" stroke-width="1.5"/>
  <line x1="256" y1="0" x2="256" y2="512" stroke="#1d3557" stroke-width="1.5"/>
  <line x1="512" y1="0" x2="512" y2="512" stroke="#1d3557" stroke-width="1.5"/>
  <line x1="768" y1="0" x2="768" y2="512" stroke="#1d3557" stroke-width="1.5"/>

  <!-- Border -->
  <rect x="20" y="20" width="984" height="472" fill="none" stroke="#2a475e" stroke-width="3"/>
  <rect x="16" y="16" width="992" height="480" fill="none" stroke="#ffb703" stroke-width="1.5" opacity="0.8"/>

  <text x="70" y="80" font-family="'Impact', 'Arial Black', sans-serif" font-size="22" font-weight="900" fill="#ffb703" letter-spacing="6">
    // CITY-WIDE 5G SATELLITE RACING UPLINK
  </text>

  <g filter="url(#goldGlow)">
    <text x="65" y="195" font-family="'Impact', 'Arial Black', sans-serif" font-size="110" font-weight="900" font-style="italic" fill="url(#goldGrad)" letter-spacing="2">
      CYBERTEL 5G
    </text>
  </g>
  <text x="68" y="270" font-family="'Impact', 'Arial Black', sans-serif" font-size="62" font-weight="900" fill="#ffffff" letter-spacing="3">
    0ms CLOUD TELEMETRY
  </text>

  <text x="70" y="340" font-family="'Segoe UI', 'Arial', sans-serif" font-size="26" font-weight="700" fill="#90e0ef" letter-spacing="2">
    REAL-TIME MULTIPLAYER SYNC. ZERO PACKET LOSS.
  </text>
  <text x="70" y="380" font-family="'Segoe UI', 'Arial', sans-serif" font-size="20" fill="#caf0f8">
    Direct Satellite Link • Unthrottled 10 Gbps Bandwidth
  </text>

  <rect x="70" y="415" width="280" height="55" rx="6" fill="#fb8500"/>
  <text x="95" y="452" font-family="'Impact', 'Arial Black', sans-serif" font-size="24" fill="#000000" letter-spacing="2">
    CONNECT TO THE GRID 📡
  </text>

  <!-- Antenna Graphic -->
  <g transform="translate(820, 240)">
    <circle cx="0" cy="0" r="100" fill="none" stroke="#ffb703" stroke-width="4" stroke-dasharray="20 10"/>
    <circle cx="0" cy="0" r="70" fill="none" stroke="#fb8500" stroke-width="4" stroke-dasharray="15 10"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="#ffffff" stroke-width="4"/>
    <circle cx="0" cy="0" r="15" fill="#ffb703"/>
    <text x="0" y="150" font-family="'Impact', sans-serif" font-size="30" fill="#ffb703" text-anchor="middle">5G ULTRA</text>
  </g>

  <text x="980" y="490" font-family="monospace" font-size="12" fill="#457b9d" text-anchor="end">
    NEON PURSUIT AD-NETWORK // CAMPAIGN ID: CYB-555
  </text>
</svg>

